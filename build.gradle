plugins {
    id 'jacoco'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.springframework.boot' version '3.5.16'//Versión de componentes de spring boot
    id 'org.sonarqube' version '5.1.0.4882'
    id "org.owasp.dependencycheck" version "10.0.4"
    id 'com.github.ben-manes.versions' version '0.46.0'
    id 'java'
}

group 'com.proyecto.servicio.empresa'
version '1.0'

java{
    sourceCompatibility=17
    targetCompatibility=17
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', '2025.0.3')
    set('postgresql.version', '42.7.15')
    set('commons-lang3.version', '3.22.0')
    set('jackson-bom.version', '2.21.4')
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}


dependencies {
    //Spring Framework
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    //Documentation y APIs
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'
    //Bases de datos
    implementation 'org.postgresql:postgresql:42.7.15'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    //Seguridad
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly('io.jsonwebtoken:jjwt-jackson:0.13.0') {
        exclude group: 'com.fasterxml.jackson.core'
    }
    //Mapeo y utilerias
    implementation 'org.mapstruct:mapstruct:1.6.3'
    //Mail-XML
    implementation 'org.glassfish.jaxb:jaxb-runtime:4.0.9'
    implementation 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.0'
    //Lombok
    implementation 'org.projectlombok:lombok:1.18.46'

    constraints {
        implementation('org.apache.commons:commons-lang3:3.22.0') {
            because 'Corrige CVE-2025-48924 (CWE-674 Uncontrolled Recursion)'
        }
        implementation('org.glassfish.jaxb:jaxb-core:4.0.9') {
            because 'Corrige vulnerabilidad XXE (CWE-611) en jaxb-core < 4.0.5'
        }
        implementation('org.postgresql:postgresql:42.7.15') {
            because 'Corrige CWE-770 y CWE-303 en postgresql < 42.7.12'
        }
        implementation('com.fasterxml.jackson.core:jackson-databind:2.21.4') {
            because 'Fuerza version parcheada de Jackson frente a dependencias transitivas antiguas'
        }
        implementation('org.bouncycastle:bcprov-jdk18on:1.87') {
            because 'Evita versiones vulnerables de BouncyCastle (< 1.79) si alguna dependencia transitiva la solicita'
        }
    }

    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    compileOnly 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    testCompileOnly 'org.projectlombok:lombok:1.18.46'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.46'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.h2database:h2'

}

configurations.all {
    exclude group: "org.apache.logging.log4j", module: "log4j-api"
    exclude group: "org.apache.logging.log4j", module: "log4j-to-slf4j"
    exclude group: "log4j", module: "log4j"
}

configurations.matching { it.name in ['compileClasspath', 'runtimeClasspath'] }.configureEach {
    resolutionStrategy.activateDependencyLocking()
}

test {
    useJUnitPlatform()
}

springBoot {
    buildInfo {
    }
}

sonarqube {
    properties {
        property "sonar.projectKey", "proyecto-servicios"
        property "sonar.projectName", "proyecto-servicios"
        property "sonar.host.url", System.getenv("SONAR_HOST_URL") ?: (System.getProperty("sonar.host.url") ?: "http://localhost:9000")
        if (System.getenv("SONAR_TOKEN") || System.getProperty("sonar.token")) {
            property "sonar.token", System.getenv("SONAR_TOKEN") ?: System.getProperty("sonar.token")
        }
        property "sonar.coverage.jacoco.xmlReportPaths", "${layout.buildDirectory.get()}/reports/jacoco/test/jacocoTestReport.xml"
    }
}   

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('sonar') {
    dependsOn jacocoTestReport
}

//ejecutar applicación dentro de contenedor
//sh gradlew clean build dockerImage dockerUp
/**
 * Genera imagen
 */
task dockerImage(type: Exec) {
    println 'CrearImagen'
    commandLine "docker", "build", "-t", "proyecto-core:0.1", "$projectDir"
}

/**
 * Ejecuta imagen
 */
task dockerUp(type: Exec) {
    println "Arranca imagen"
    commandLine "docker-compose", "--compatibility", "up"
}

dependencyCheck {
    formats = ["JSON", "HTML"]
}